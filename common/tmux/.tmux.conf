# Tmux Configuration

## ============================================================================
## Version Detection (for Ubuntu 18.04 / tmux 2.6 compatibility)
## ============================================================================

# Extract tmux version as an integer (e.g. 2.6 -> 26, 3.2a -> 32) for comparisons
run-shell "tmux setenv -g TMUX_VERSION $(tmux -V | sed -En 's/^tmux[^0-9]*([0-9]+)\\.([0-9]+).*/\\1\\2/p')"

## ============================================================================
## General Settings
## ============================================================================

# Enable mouse support (tmux >= 2.1 syntax)
if-shell -b '[ "$TMUX_VERSION" -ge 21 ]' \
    "set -g mouse on" \
    "set -g mode-mouse on ; set -g mouse-select-pane on ; set -g mouse-resize-pane on ; set -g mouse-select-window on"

# Enable status bar
set -g status on

# Extended pane histories
set-option -g history-limit 10000

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable RGB colour if running in xterm
set -g default-terminal "screen-256color"

## ============================================================================
## Key Bindings
## ============================================================================

# Set prefix key to Ctrl-A (like screen)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Split panes with | and "
bind '|' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'

# Create new window in current path
bind c new-window -c '#{pane_current_path}'
bind C new-window -d -c '#{pane_current_path}'  # Background window

# Fast pane resizing (can hold arrow keys)
bind -n C-S-Up resize-pane -U 1
bind -n C-S-Down resize-pane -D 1
bind -n C-S-Left resize-pane -L 1
bind -n C-S-Right resize-pane -R 1

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

## ============================================================================
## Copy Mode
## ============================================================================

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Vim-style copy/paste
# tmux >= 2.4 uses `send -X begin-selection`; older versions use the legacy syntax.
if-shell -b '[ "$TMUX_VERSION" -ge 24 ]' \
    "bind -T copy-mode-vi v send -X begin-selection" \
    "bind -t vi-copy v begin-selection"

# Copy to both tmux buffer AND system clipboard (y key)
# Wrap modern copy-pipe-and-cancel bindings in a version guard so tmux 2.6 doesn't choke.
if-shell -b '[ "$TMUX_VERSION" -ge 24 ]' " \
    if-shell \"command -v pbcopy >/dev/null 2>&1\" \
        \"bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'\" ; \
    if-shell \"command -v xclip >/dev/null 2>&1\" \
        \"bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard -i'\" ; \
    if-shell \"command -v xsel >/dev/null 2>&1\" \
        \"bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xsel -i --clipboard'\" \
"

# Legacy (tmux < 2.4) copy bindings via copy-pipe
if-shell -b '[ "$TMUX_VERSION" -lt 24 ]' " \
    if-shell \"command -v pbcopy >/dev/null 2>&1\" \
        \"bind -t vi-copy y copy-pipe 'pbcopy'\" ; \
    if-shell \"command -v xclip >/dev/null 2>&1\" \
        \"bind -t vi-copy y copy-pipe 'xclip -selection clipboard -i'\" ; \
    if-shell \"command -v xsel >/dev/null 2>&1\" \
        \"bind -t vi-copy y copy-pipe 'xsel -i --clipboard'\" \
"

# Fix mouse scrolling — only enable on tmux >= 2.1 (older syntax handled above).
# Note: removed stray space in `-Ft =` (was `-Ft = '...'`) which is rejected by stricter parsers.
if-shell -b '[ "$TMUX_VERSION" -ge 21 ]' " \
    bind -n WheelUpPane if-shell -Ft= '#{?pane_in_mode,1,#{mouse_any_flag}}' \
        'send -Mt=' 'if-shell -Ft= \"#{alternate_on}\" \
        \"send -t= Up\" \"copy-mode -et=\"' ; \
    bind -n WheelDownPane if-shell -Ft= '#{?pane_in_mode,1,#{mouse_any_flag}}' \
        'send -Mt=' 'if-shell -Ft= \"#{alternate_on}\" \
        \"send -t= Down\" \"send -Mt=\"' \
"

## ============================================================================
## Status Bar
## ============================================================================

# Update status bar every second
set -g status-interval 1

# Center window list
set -g status-justify centre

# Status bar colors (tmux >= 2.9 uses unified -style; older uses split fg/bg options)
if-shell -b '[ "$TMUX_VERSION" -ge 29 ]' " \
    set -g status-style fg=white,bg=black ; \
    setw -g window-status-style fg=cyan,bg=black ; \
    setw -g window-status-current-style fg=black,bg=cyan,bright ; \
    set -g pane-border-style fg=white ; \
    set -g pane-active-border-style fg=cyan \
" " \
    set -g status-fg white ; \
    set -g status-bg black ; \
    setw -g window-status-fg cyan ; \
    setw -g window-status-bg black ; \
    setw -g window-status-current-fg black ; \
    setw -g window-status-current-bg cyan ; \
    setw -g window-status-current-attr bright ; \
    set -g pane-border-fg white ; \
    set -g pane-active-border-fg cyan \
"

# Status bar left: session name
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"

# Status bar right: date and time
set -g status-right "#[fg=cyan]%d %b %R"

## ============================================================================
## Pane Management
## ============================================================================

# Join pane from another window
bind m choose-window 'join-pane -h -s "%%"'  # Horizontal split (side-by-side)
bind M choose-window 'join-pane -v -s "%%"'  # Vertical split (top-bottom)

# Swap panes
bind > swap-pane -D  # Swap with next pane
bind < swap-pane -U  # Swap with previous pane

## ============================================================================
## Mouse and Clipboard
## ============================================================================

# Copy to system clipboard on mouse selection (tmux >= 2.4 syntax)
if-shell -b '[ "$TMUX_VERSION" -ge 24 ]' " \
    if-shell \"command -v pbcopy >/dev/null 2>&1\" \
        \"bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'\" ; \
    if-shell \"command -v xclip >/dev/null 2>&1\" \
        \"bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'\" ; \
    if-shell \"command -v xsel >/dev/null 2>&1\" \
        \"bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xsel -i --clipboard'\" \
"

## ============================================================================
## Personal Profile
## ============================================================================

# Respect user configs in $TMUX_PERSONAL_PROFILE
if-shell "[ -f ~/.tmux.profile ]" "source-file ~/.tmux.profile"
